[project]
name = "pimm-data"
version = "0.3.0"
description = "Multimodal detector dataset loaders (LArTPC, Water Cherenkov) for particle-imaging ML workflows."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "h5py",
    "hdf5plugin",  # blosc/zstd/lz4 HDF5 filters — required to read JAXTPC
                   # production output (default codec is blosc-zstd)
    "torch>=2.5",
                        # editable install must not pull a different CUDA build
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Data the code loads by default: the plane-geometry registry and the measured
# noise spectrum (pimm_data.noise.DEFAULT_SERIES_SPECTRUM). Without this they are
# missing from a built wheel — an editable install hides it because the files are
# simply present on disk.
[tool.setuptools.package-data]
"pimm_data" = ["data/*.json", "data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "pimm-data"
# Read from src/pimm_data/__init__.py rather than duplicated here. The two
# sat at 0.3.0 in BOTH files with nothing keeping them equal; helix hit
# exactly this drift (0.1.0 vs 0.2.0) and it was not cosmetic there.
dynamic = ["version"]
description = "Multimodal detector dataset loaders (LArTPC, Water Cherenkov) for particle-imaging ML workflows."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "h5py",
    "hdf5plugin",  # blosc/zstd/lz4 HDF5 filters — required to read JAXTPC
                   # production output (default codec is blosc-zstd)
    "scipy",       # transform.py imports scipy{,.ndimage,.interpolate,.stats}
                   # and scipy.spatial.cKDTree at MODULE scope, and __init__.py
                   # imports transform — so `import pimm_data` raises
                   # ModuleNotFoundError without it. It was undeclared and
                   # worked only by accident: scipy arrives via jax[cpu] in the
                   # container and via scikit-learn/torch_cluster/torch_sparse
                   # in pimm-fm's lock. A clean install of this package alone
                   # produced an unimportable package.
    "torch>=2.5",
                        # editable install must not pull a different CUDA build
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "pimm_data.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# Data the code loads by default: the plane-geometry registry that
# geometry.load_plane_registry falls back to. Without this it is missing from a
# built wheel — an editable install hides it because the file is simply present
# on disk.
#
# noise_spectrum.npz was dropped with the forward model: its only loader was
# pimm_data.noise.DEFAULT_SERIES_SPECTRUM, which is helix's now. helix ships the
# byte-identical file as helix/tpc/data/noise_spectrum.npz.
[tool.setuptools.package-data]
"pimm_data" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
